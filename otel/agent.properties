# OpenTelemetry Java agent settings, loaded with
#   -Dotel.javaagent.configuration-file=otel/agent.properties
# otel.service.name is passed per service on the command line.

otel.exporter.otlp.protocol=grpc
otel.exporter.otlp.endpoint=http://localhost:14317
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp

# Bridge Micrometer -> OTel: exports Spring and Spring AI metrics (token usage, tool calls, ...)
otel.instrumentation.micrometer.enabled=true

# Attach trace ids to metric samples (exemplars)
otel.metrics.exemplar.filter=always_on

# Push metrics every 10 s instead of 60 s: faster feedback in a lab
otel.metric.export.interval=10000
